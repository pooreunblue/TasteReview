<header class="site-header" th:fragment="header">
  <div class="container site-header__inner">
    <a class="site-header__brand" th:href="@{/reviews}">TasteReview</a>
    <nav class="site-header__nav" aria-label="주요 메뉴">
      <a class="site-header__link" th:href="@{/reviews}">리뷰</a>
      <a class="site-header__link" th:if="${isAuthenticated}"
         th:href="@{/reviews/new}">리뷰 등록</a>
      <form class="site-header__form" th:if="${isAuthenticated}"
            th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">
        <button class="site-header__link site-header__button" type="submit">로그아웃</button>
      </form>
      <a class="site-header__link" th:unless="${isAuthenticated}"
         th:href="@{/login}">로그인</a>
      <a class="site-header__link" th:unless="${isAuthenticated}"
         th:href="@{/signup}">회원가입</a>
    </nav>
  </div>
</header>
