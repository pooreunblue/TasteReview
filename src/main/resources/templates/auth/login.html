<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('로그인', ~{::main})}">
<head><title></title></head>
<body>
<main class="page-main page-main--narrow">
  <h1 class="page-title">로그인</h1>

  <p class="form-success" th:if="${registeredMessage}"
     th:text="${registeredMessage}"></p>
  <p class="form-error" th:if="${loginError}" th:text="${loginError}"></p>

  <form class="auth-form" method="post" th:action="@{/login}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <div class="field">
      <label class="field__label" for="email">이메일</label>
      <input class="field__input" type="email" id="email" name="username" autocomplete="username"
             required>
    </div>
    <div class="field">
      <label class="field__label" for="password">비밀번호</label>
      <input class="field__input" type="password" id="password" name="password"
             autocomplete="current-password" required>
    </div>
    <button class="btn btn--primary" type="submit">로그인</button>
  </form>

  <p class="auth-form__hint">
    아직 회원이 아니신가요?
    <a th:href="@{/signup}">회원가입</a>
  </p>
</main>
</body>
</html>
