<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('회원가입', ~{::main})}">
<head><title></title></head>
<body>
<main class="page-main page-main--narrow">
  <h1 class="page-title">회원가입</h1>

  <form class="auth-form" method="post" th:action="@{/signup}"
        th:object="${memberForm}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <div class="field">
      <label class="field__label" for="email">이메일</label>
      <input class="field__input" type="email" id="email" th:field="*{email}"
             autocomplete="username">
      <p class="form-error" th:if="${#fields.hasErrors('email')}"
         th:errors="*{email}"></p>
    </div>
    <div class="field">
      <label class="field__label" for="password">비밀번호</label>
      <input class="field__input" type="password" id="password" th:field="*{password}"
             autocomplete="new-password">
      <p class="field__hint">영문·숫자를 각각 1개 이상 포함한 8자 이상</p>
      <p class="form-error" th:if="${#fields.hasErrors('password')}"
         th:errors="*{password}"></p>
    </div>
    <div class="field">
      <label class="field__label" for="nickname">닉네임</label>
      <input class="field__input" type="text" id="nickname" th:field="*{nickname}"
             autocomplete="nickname">
      <p class="form-error" th:if="${#fields.hasErrors('nickname')}"
         th:errors="*{nickname}"></p>
    </div>
    <button class="btn btn--primary" type="submit">가입하기</button>
  </form>

  <p class="auth-form__hint">
    이미 계정이 있으신가요?
    <a th:href="@{/login}">로그인</a>
  </p>
</main>
</body>
</html>
