spring:
  application:
    name: TasteReview
  profiles:
    default: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tastereview}
    username: ${SPRING_DATASOURCE_USERNAME:tastereview}
    password: ${SPRING_DATASOURCE_PASSWORD:tastereview}
  jpa:
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:5MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:20MB}
  thymeleaf:
    cache: false
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  review:
    rating-min: 1
    rating-max: 5
    page-size: ${APP_REVIEW_PAGE_SIZE:10}
  comment:
    page-size: ${APP_COMMENT_PAGE_SIZE:20}
  search:
    min-keyword-length: ${APP_SEARCH_MIN_KEYWORD_LENGTH:2}
  image:
    max-count: ${APP_IMAGE_MAX_COUNT:5}
    allowed-types: ${APP_IMAGE_ALLOWED_TYPES:image/jpeg,image/png,image/webp}
  regions: ${APP_REGIONS:강남구,강동구,강북구,강서구,관악구,광진구,구로구,금천구,노원구,도봉구,동대문구,동작구,마포구,서대문구,서초구,성동구,성북구,송파구,양천구,영등포구,용산구,은평구,종로구,중구,중랑구}