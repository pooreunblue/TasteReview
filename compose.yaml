name: tastereview

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tastereview
      POSTGRES_USER: tastereview
      POSTGRES_PASSWORD: tastereview
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tastereview"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/tastereview
      SPRING_DATASOURCE_USERNAME: tastereview
      SPRING_DATASOURCE_PASSWORD: tastereview
      SPRING_PROFILES_ACTIVE: dev
      APP_REGIONS: 강남구,강동구,강북구,강서구,관악구,광진구,구로구,금천구,노원구,도봉구,동대문구,동작구,마포구,서대문구,서초구,성동구,성북구,송파구,양천구,영등포구,용산구,은평구,종로구,중구,중랑구
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data: